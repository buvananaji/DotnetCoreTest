name: 'Dotnetcoretest CI Pipeline'

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  DYNATRACE_ENVIRONMENT_ID: ${{ secrets.DYNATRACE_ENVIRONMENT_ID }}
  DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
  SPLUNK_HEC_URL: ${{ secrets.SPLUNK_HEC_URL }}
  SPLUNK_HEC_TOKEN: ${{ secrets.SPLUNK_HEC_TOKEN }}
  NEXUS_REPO_URL: ${{ secrets.NEXUS_REPO_URL }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: 'Set up .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 'Restore & build'
        run: |
          dotnet restore "dncoretest-main/DotnetCoreTest.csproj"
          dotnet build "dncoretest-main/DotnetCoreTest.csproj" --configuration Release --no-restore

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: 'Set up .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 'Run unit tests'
        run: |
          cat > coverlet.runsettings <<'EOF'
          <RunSettings><DataCollectionRunSettings><DataCollectors><DataCollector friendlyName="XPlat Code Coverage"><Configuration><Format>opencover</Format></Configuration></DataCollector></DataCollectors></DataCollectionRunSettings></RunSettings>
          EOF
          dotnet test "dncoretest-main/DotnetCoreTest.csproj" --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

  sonarqube:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: 'Set up .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 'Sonar: set up JDK'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 'Sonar: install scanner'
        run: |
          dotnet tool install --global dotnet-sonarscanner
      - name: 'Sonar scan begin'
        run: |
          dotnet-sonarscanner begin /k:"buvananaji_DotnetCoreTest" /d:sonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" /d:sonar.token="$SONAR_TOKEN" /d:sonar.qualitygate.wait=false /d:sonar.exclusions="**/.github/**,**/Program.cs" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
      - name: 'Sonar build'
        run: |
          dotnet build "dncoretest-main/DotnetCoreTest.csproj" --configuration Release
      - name: 'Sonar scan end'
        run: |
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SAST (Fortify)
        run: echo "SAST analysis via Fortify integration (placeholder)"

      - name: Run SCA (Sonatype)
        run: echo "SCA analysis via Sonatype integration (placeholder)"

  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run DAST (Fortify WebInspect)
        run: echo 'DAST analysis via Fortify WebInspect (placeholder)'

  # container build disabled in configuration

  # helm update disabled in configuration
    # needs: container
    # runs-on: ubuntu-latest
    # steps:
      # - name: Update Helm Chart
        # run: echo 'Update Helm chart (placeholder)'

  notify:
    needs: [build, test, sonarqube, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Dynatrace
        run: echo "Send build metrics to Dynatrace (placeholder)"

      - name: Notify Splunk
        run: echo "Send execution logs to Splunk (placeholder)"
