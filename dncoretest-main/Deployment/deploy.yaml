apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnetcoretest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dotnetcoretest
  template:
    metadata:
      labels:
        app: dotnetcoretest
    spec:
      containers:
      - name: dotnetcoretest
        image: dockerbuvana123/my-dotnet-app:TestImage
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dotnetcoretest
spec:
  type: LoadBalancer
  selector:
    app: dotnetcoretest
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
